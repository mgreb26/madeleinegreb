<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unit 1 | Maddie Greb</title>
  <style>
    :root {
      --header-bg: #e98baa;
      --header-color: #ffffff;
      --max-width: 900px;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: #fdf5f8;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      padding: 0 1rem 2rem;
    }

    header {
      background: var(--header-bg);
      color: var(--header-color);
      padding: 2rem 1rem 1.25rem;
      text-align: center;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      letter-spacing: 0.5px;
    }

    header p {
      margin: 0.5rem 0 1.25rem;
      font-size: 1.05rem;
    }

    nav ul {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    nav a {
      color: var(--header-color);
      font-weight: 600;
      text-decoration: none;
    }

    nav a:hover,
    nav a:focus {
      text-decoration: underline;
    }

    #unit-1,
    #blog {
      background: #ffffff;
      margin: 1.5rem 0 0;
      padding: 1.25rem 1.25rem;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(16,24,40,0.04);
    }

    #unit-1 h2,
    #blog h2 {
      margin-top: 0;
      color: #0f172a;
      font-size: 1.25rem;
    }

    #unit-1 p,
    #blog p {
      color: #111827;
      line-height: 1.6;
      margin: 0.5rem 0 0;
    }

    .lens-gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
      margin: 1.25rem 0 1.5rem;
    }

    .lens-card {
      margin: 0;
    }

    .lens-card a {
      display: block;
      color: #111827;
      text-decoration: none;
    }

    .lens-card a:hover .lens-preview,
    .lens-card a:focus .lens-preview {
      border-color: var(--header-bg);
      box-shadow: 0 0 0 3px rgba(233, 139, 170, 0.2);
    }

    .lens-preview {
      display: block;
      width: 100%;
      height: 220px;
      border: 1px solid #f1c3d2;
      border-radius: 6px;
      background: #fdf5f8;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .lens-card figcaption {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }

    .paragraph-space {
      min-height: 7rem;
      border: 1px dashed #e98baa;
      border-radius: 6px;
      margin-top: 1rem;
    }

    @media (max-width: 700px) {
      .lens-gallery {
        grid-template-columns: 1fr;
      }

      .lens-preview {
        height: 280px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Unit 1 Lens-Based Analysis Essay</h1>
      <p>Writing Process Archive</p>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="index.html#about">About</a></li>
          <li><a href="unit1.html">Unit 1</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="unit-1">
        <h2>Unit 1</h2>
      </section>

      <section id="blog">
        <h2>Blog: A Phenomenon in My World</h2>

        <div class="lens-gallery" aria-label="Lens images">
          <figure class="lens-card">
            <a href="lens%20%231;%20roots%20of%20tree.pdf" target="_blank" rel="noopener" aria-label="Open Lens 1: Roots of Tree PDF in a new tab">
              <object class="lens-preview" data="lens%20%231;%20roots%20of%20tree.pdf" type="application/pdf" aria-label="Preview of Lens 1: Roots of Tree PDF">
                <span>Open Lens 1: Roots of Tree PDF</span>
              </object>
              <figcaption>Lens #1: Roots of Tree</figcaption>
            </a>
          </figure>

          <figure class="lens-card">
            <a href="patterns;%20tree%20branches.pdf" target="_blank" rel="noopener" aria-label="Open Patterns: Tree Branches PDF in a new tab">
              <object class="lens-preview" data="patterns;%20tree%20branches.pdf" type="application/pdf" aria-label="Preview of Patterns: Tree Branches PDF">
                <span>Open Patterns: Tree Branches PDF</span>
              </object>
              <figcaption>Patterns: Tree Branches</figcaption>
            </a>
          </figure>

          <figure class="lens-card">
            <a href="phenomenon;%20trunk%20of%20tree.pdf" target="_blank" rel="noopener" aria-label="Open Phenomenon: Trunk of Tree PDF in a new tab">
              <object class="lens-preview" data="phenomenon;%20trunk%20of%20tree.pdf" type="application/pdf" aria-label="Preview of Phenomenon: Trunk of Tree PDF">
                <span>Open Phenomenon: Trunk of Tree PDF</span>
              </object>
              <figcaption>Phenomenon: Trunk of Tree</figcaption>
            </a>
          </figure>
        </div>

        <div class="paragraph-space" aria-label="Space for paragraphs"></div>
      </section>
    </main>
  </div>
</body>
</html>
