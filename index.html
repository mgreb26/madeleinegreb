<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maddie Greb</title>
  <style>
    :root {
      --header-bg: #e98baa;
      --header-color: #ffffff;
      --max-width: 900px;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: #fdf5f8;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      padding: 0 1rem 2rem;
    }

    header {
      background: var(--header-bg);
      color: var(--header-color);
      padding: 2rem 1rem 1.25rem;
      text-align: center;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      letter-spacing: 0.5px;
    }

    header p {
      margin: 0.5rem 0 1.25rem;
      font-size: 1.05rem;
    }

    nav ul {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    nav a {
      color: var(--header-color);
      font-weight: 600;
      text-decoration: none;
    }

    nav a:hover,
    nav a:focus {
      text-decoration: underline;
    }

    /* About section */
    #about {
      background: #ffffff;
      margin: 1.5rem 0 0;
      padding: 1.25rem 1.25rem;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(16,24,40,0.04);
    }

    #about h2 {
      margin-top: 0;
      color: #0f172a;
      font-size: 1.25rem;
    }

    #about p {
      color: #111827;
      line-height: 1.6;
      margin: 0.5rem 0 0;
    }

    @media (min-width: 640px) {
      #about p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Maddie Greb</h1>
      <p>English student at IU</p>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="#about">About</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="about">
        <h2>About me</h2>
        <p>
          Hello I am Maddie and I'm from Indianapolis. My major is Exercise Science on the Pre-PA track. I plan on joining multiple clubs while at IU such as the American Medical Women's Association to [...]
        </p>
      </section>
    </main>
  </div>
</body>
</html>
