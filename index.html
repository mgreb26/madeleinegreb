<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maddie Greb</title>
  <style>
    :root {
      --header-bg: #1e90ff; /* DodgerBlue */
      --header-color: #ffffff;
      --max-width: 900px;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: #f7f9fc;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      padding: 0 1rem;
    }

    header {
      background: var(--header-bg);
      color: var(--header-color);
      padding: 2rem 1rem;
      text-align: center;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Maddie Greb</h1>
    </header>
  </div>
</body>
</html>
